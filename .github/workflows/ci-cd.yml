name: CI/CD DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Simulate application build
        run: |
          python -m compileall app
          python app/calculator.py
          echo "Application build completed successfully."

  test:
    name: Validate and Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint validation
        run: |
          flake8 app tests --select=E9,F63,F7,F82 --show-source

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests --verbose

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Scan Python dependencies
        run: |
          pip-audit -r requirements.txt

  deploy:
    name: Simulated Deployment
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Simulate deployment
        run: |
          echo "Deploying the sample application..."
          echo "Commit: ${{ github.sha }}"
          echo "Branch or reference: ${{ github.ref }}"
          echo "Deployment completed successfully."
